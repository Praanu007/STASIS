.tag.wake { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.tag.start, .tag.stop { background: var(--panel-2); }
.ev-empty { padding: 22px 16px; color: var(--ink-3); font-size: 12.5px; }
.ev-sum { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
.ev-sum b { color: var(--ink-2); font-weight: 600; }
.kv { padding: 12px 16px; display: grid; gap: 10px; }
.kv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; font-size: 12.5px; }
.kv-row .l { color: var(--ink-2); }
.kv-row .v { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.kv-row .bar2 { grid-column: 1 / -1; height: 4px; border-radius: 3px; background: var(--track); overflow: hidden; }
.kv-row .bar2 i { display: block; height: 100%; background: var(--ink-3); border-radius: 3px; }
.sched-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sched-name { font-family: var(--f-mono); font-size: 13.5px; font-weight: 500; }
.small { font-size: 12px; color: var(--ink-3); }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--track); gap: 2px; }
.stack i { display: block; height: 100%; }
.stack .jobs { background: var(--heat-1); }
.stack .other { background: var(--ink-3); }
.stack .swap { background: var(--frost-ink); }
.mem-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.mem-legend span { display: inline-flex; align-items: center; gap: 6px; }
.mem-legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
.summary > div { background: var(--panel); padding: 11px 16px; }
.summary .l { font-size: 11.5px; color: var(--ink-3); }
.summary .v { font-size: 16px; font-weight: 600; margin-top: 2px; }

/* tooltip */
.tip {
  position: fixed; z-index: 50; pointer-events: none; min-width: 180px; max-width: 280px;
  background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  box-shadow: 0 16px 40px -14px rgba(0, 0, 0, .55); font-size: 12px;
}
.tip .th { color: var(--ink-3); font-size: 11.5px; margin-bottom: 6px; display: flex; gap: 8px; justify-content: space-between; }
.tip .tr { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 2px 0; }
.tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.tip .tr span { color: var(--ink-2); }
.tip .k { width: 12px; height: 2px; border-radius: 2px; }
.tip .k.box { height: 8px; border-radius: 2px; }

/* results */
.res-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; }
.res-grid .wide { grid-column: 1 / -1; }
.chart-box { padding: 10px 12px 6px; position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-box svg text { font-family: var(--f-ui); }
.facets { display: grid; gap: 4px 28px; }
.facets.two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.facet { min-width: 0; }
.facet h3 { margin: 6px 0 2px; font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
.tbl-wrap { overflow-x: auto; }
#runs-tbl { max-height: 560px; overflow: auto; }
#runs-tbl thead th { position: sticky; top: 0; z-index: 1; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 11.5px; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel-2); }
table.data td { padding: 9px 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: top; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr:last-child td { border-bottom: 0; }
table.data td .claim { color: var(--ink-2); font-size: 12px; display: block; margin-top: 2px; max-width: 46ch; }
table.data td.claimcell { color: var(--ink-2); min-width: 26ch; max-width: 72ch; }
table.data tr.cont td:not([rowspan]) { border-bottom-color: transparent; }
table.data td .claim.m-only { display: none; }
.verdict { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.verdict svg { width: 13px; height: 13px; }
.verdict.pass svg { color: var(--good); }
.verdict.fail svg { color: var(--critical); }
.verdict.missing svg { color: var(--ink-3); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.swatch.dashed { background: transparent !important; box-shadow: inset 0 0 0 2px currentColor; }
.empty {
  padding: 34px 20px; text-align: center; color: var(--ink-2); display: grid; gap: 10px; justify-items: center;
}
.empty h3 { font-size: 15px; color: var(--ink); }
.empty p { margin: 0; max-width: 58ch; }
pre.cmd {
  margin: 0; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 14px; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); overflow-x: auto; max-width: 100%;
}
.offline-card { max-width: 760px; margin: 40px auto; }
.foot { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 11.5px; color: var(--ink-3); }
.foot b { color: var(--ink-2); font-weight: 500; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .deck { grid-template-columns: minmax(0, 1fr); }
  .rail { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpis .hero { grid-column: 1 / -1; }
}
@media (max-width: 900px) {
  :root { --label-w: 128px; --stats-w: 176px; }
  .res-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brand .sub { display: none; }
}
@media (max-width: 640px) {
  .top-in { gap: 10px; }
  .pills { margin-left: 0; width: 100%; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; padding: 6px 4px; }
  .hero .k-value { font-size: 46px; }
  /* job rows: label + stats on one line, the lane full width below */
  .irow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .psi-row { grid-template-areas: "plot plot" "ylab ro"; grid-template-rows: 150px auto; height: auto; }
  .psi-row .ylab { grid-area: ylab; border-right: 0; border-top: 1px solid var(--line); padding: 10px 16px; }
  .psi-row .ylab .tick { display: none; }
  .psi-row .plot { grid-area: plot; }
  .psi-row .readout { grid-area: ro; border-left: 1px solid var(--line); border-top: 1px solid var(--line); padding: 10px 16px; }
  .lanes-h { grid-template-areas: "a c"; }
  .lanes-h > div:nth-child(2) { display: none; }
  .lane, #lanes.ws .lane { height: auto; grid-template-areas: "lab stats" "plot plot"; grid-template-rows: 38px 26px; }
  #lanes.ws .lane { grid-template-rows: 50px 26px; }
  .lane .lab { grid-area: lab; border-right: 0; }
  .lane .stats { grid-area: stats; border-left: 0; }
  .lane .plot { grid-area: plot; margin: 0 16px 8px; }
  .lane + .lane .lab, .lane + .lane .stats { border-top: 0; }
  .lane + .lane { border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .xaxis-row { grid-template-areas: "x x"; }
  .xaxis-row > div:first-child, .xaxis-row > div:last-child { display: none; }
  .xaxis-row .xaxis { grid-column: 1 / -1; margin: 0 16px; }
  .ev { grid-template-columns: 40px minmax(0, 1fr); }
  .ev .tag { grid-column: 2; justify-self: start; }
  .ev .b { grid-column: 2; }
  /* hypotheses: the claim under its id; the verdict stays on screen */
  table.data td .claim.m-only { display: block; }
  table.data .claimcell, table.data .m-hide { display: none; }
}
@media (max-width: 420px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
}
</style>
